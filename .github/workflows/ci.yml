name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RAILMIND_E2E_API_KEY: ci-e2e-api-key

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run backend tests
        working-directory: backend
        run: |
          pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        working-directory: frontend
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
          VITE_RAILMIND_API_KEY: ${{ env.RAILMIND_E2E_API_KEY }}
          VITE_WS_URL: ws://127.0.0.1:8000
        run: |
          npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          npx playwright install --with-deps

      - name: Start backend server
        working-directory: backend
        env:
          RAILMIND_API_KEY: ${{ env.RAILMIND_E2E_API_KEY }}
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend-server.log 2>&1 &

      - name: Serve frontend build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
          VITE_RAILMIND_API_KEY: ${{ env.RAILMIND_E2E_API_KEY }}
          VITE_WS_URL: ws://127.0.0.1:8000
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 &

      - name: Wait for backend and frontend services
        run: |
          echo "Waiting for backend docs and frontend build to become available"
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/docs >/dev/null 2>&1 && curl --silent --fail http://127.0.0.1:5173 >/dev/null 2>&1; then
              echo "Backend and frontend are available"
              exit 0
            fi
            echo "Services not ready yet, retrying ($i/30)..."
            sleep 1
          done
          echo "Services failed to become ready"
          echo "=== backend server log ==="
          cat backend/backend-server.log || true
          exit 1

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_BASE: http://127.0.0.1:8000/api
          E2E_RAILMIND_API_KEY: ${{ env.RAILMIND_E2E_API_KEY }}
        run: |
          npx playwright test --reporter=github
