name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run backend tests
        working-directory: backend
        run: |
          pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend deps
        working-directory: frontend
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          npx playwright install --with-deps

      - name: Start backend server
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend-server.log 2>&1 &

      - name: Serve frontend build
        working-directory: frontend
        run: |
          npx http-server dist -p 5173 &

      - name: Wait for backend API
        run: |
          echo "Waiting for backend at http://127.0.0.1:8000/api/health"
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/api/health | grep -q '"status":"online"'; then
              echo "Backend available"
              exit 0
            fi
            echo "Backend not ready yet, retrying ($i/30)..."
            sleep 2
          done
          echo "Backend failed to become ready"
          cat backend/backend-server.log || true
          exit 1

      - name: Run Playwright E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_BASE: http://127.0.0.1:8000/api
        run: |
          npx playwright test --reporter=github
