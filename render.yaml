services:
  # Backend - FastAPI
  - type: web
    name: railmind-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./railmind.db
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: https://railmind-frontend.onrender.com

  # Frontend - React/Vite
  - type: web
    name: railmind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://railmind-backend.onrender.com/api
      - key: VITE_WS_URL
        value: wss://railmind-backend.onrender.com
